swagger: '2.0'
info:
  title: SSRF Test API
  description: "Attempting SSRF via user-controlled URL parameter"
  version: '1.0'
host: target.com
basePath: /
schemes:
  - http
paths:
  /ssrf-test:
    get:
      summary: "Test SSRF via URL query param"
      description: "Send a GET request to an internal or external URL"
      parameters:
        - in: query
          name: url
          required: true
          type: string
          description: "URL to fetch"
      responses:
        '200':
          description: "Response from the target URL"
